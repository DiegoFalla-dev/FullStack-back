spring.application.name=ticketflow
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticketflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.devtools.restart.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=false

ticketflow.jwt.secret=${TICKETFLOW_JWT_SECRET:replace-with-32-char-minimum-secret-key}
ticketflow.jwt.expiration-ms=${TICKETFLOW_JWT_EXPIRATION_MS:3600000}
