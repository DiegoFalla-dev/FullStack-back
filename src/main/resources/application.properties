spring.application.name=ticketflow
spring.datasource.url=jdbc:mysql://localhost:3306/ticketflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.devtools.restart.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=false

ticketflow.jwt.secret=replace-with-32-char-minimum-secret-key
ticketflow.jwt.expiration-ms=3600000
