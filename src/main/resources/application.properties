spring.application.name=ticketflow
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ticketflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.devtools.restart.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=false

ticketflow.jwt.secret=${TICKETFLOW_JWT_SECRET:replace-with-32-char-minimum-secret-key}
ticketflow.jwt.expiration-ms=${TICKETFLOW_JWT_EXPIRATION_MS:3600000}

# --- Spring Boot Admin / Actuator ---
# El backend se registra como cliente en el servidor Spring Admin.
spring.boot.admin.client.url=${SPRING_BOOT_ADMIN_URL:http://localhost:8089}
spring.boot.admin.client.instance.name=TicketFlow Backend
spring.boot.admin.client.instance.service-base-url=${TICKETFLOW_SERVICE_BASE_URL:http://localhost:8080}

# Endpoints que Spring Admin usa para health, metricas, logs y diagnostico.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=when_authorized
management.endpoint.configprops.show-values=when_authorized
management.info.env.enabled=true
info.app.name=TicketFlow Backend
info.app.description=Backend del sistema de venta y registro de eventos
info.app.version=@project.version@

# --- Logging (visibilidad de autenticación, JWT y WebSocket) ---
logging.level.com.fullstack.ticketflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
# Patrón de consola legible para la demostracion
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{0}] - %msg%n
